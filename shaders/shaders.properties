# ============================================================
#  RealisticPBR - shaders.properties
# ============================================================

    profile.default=default
    profile.default.name=Standard

# --- Shadow Map ---
shadowMapResolution = 2048
shadow.enabled = true
shadow.terrain.enabled = true
shadow.translucent.enabled = true
shadow.entities.enabled = true
shadow.block.enabled = true

# --- Wehende Blöcke (mc_Entity IDs) ---
block.10001 = minecraft:tallgrass minecraft:double_plant minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sapling minecraft:red_flower minecraft:yellow_flower minecraft:vine
block.10002 = minecraft:leaves minecraft:leaves2

# --- Wasser-Blöcke ---
block.10010 = minecraft:water minecraft:flowing_water

# --- Einstellbare Optionen (im Ingame-Shader-Menu sichtbar) ---
screen = <empty> RENDER_QUALITY <empty> SHADOW_QUALITY <empty> BLOOM_STRENGTH WATER_REFLECTION <empty> FOG_DENSITY

sliders = RENDER_QUALITY SHADOW_QUALITY BLOOM_STRENGTH FOG_DENSITY

option.RENDER_QUALITY = 0.5 0.75 1.0 1.25 1.5
option.RENDER_QUALITY.comment = Interne Render-Aufloesung relativ zur Fenstergroesse

option.SHADOW_QUALITY = 1024 2048 4096
option.SHADOW_QUALITY.comment = Aufloesung der Shadow Map (hoeher = schaerfere Schatten, mehr Leistung)

option.BLOOM_STRENGTH = 0.0 0.15 0.3 0.45 0.6
option.BLOOM_STRENGTH.comment = Staerke des Bloom-Effekts an hellen Stellen

option.WATER_REFLECTION = true false
option.WATER_REFLECTION.comment = Fresnel-Himmelsreflexion auf Wasseroberflaechen

option.FOG_DENSITY = 0.0 0.5 1.0 1.5 2.0
option.FOG_DENSITY.comment = Dichte des hoehen- und distanzbasierten Nebels

# --- Composite Zwischenspeicher (HDR fuer Bloom/Tonemapping) ---
colortex0Format = RGBA16F
colortex1Format = RGBA16F
colortex2Format = RGBA16F

# --- Composite-Kette ---
composite1.enabled = BLOOM_STRENGTH > 0.0
composite2.enabled = BLOOM_STRENGTH > 0.0
composite3.enabled = true
